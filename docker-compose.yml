services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sport-analytics-backend
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sport-analytics-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8080
    ports:
      - "3000:3000"